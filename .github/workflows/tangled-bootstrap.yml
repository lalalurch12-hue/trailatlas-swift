name: One-time Tangled migration
# Temporary bridge for migration completion; remove its secret after acceptance.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tangled-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture the Tangled SSH server public key
        run: |
          mkdir -p .runtime
          ssh-keyscan -T 15 -t ed25519 tangled.org > .runtime/tangled-known-hosts
          test -s .runtime/tangled-known-hosts
          ssh-keygen -lf .runtime/tangled-known-hosts
          cmp .tangled/ssh_known_hosts .runtime/tangled-known-hosts
      - name: Transfer history only after the write credential is approved and configured
        env:
          TANGLED_BOOTSTRAP_KEY_B64: ${{ secrets.TANGLED_BOOTSTRAP_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$TANGLED_BOOTSTRAP_KEY_B64" ]]; then
            echo 'WAITING: Preflight only. No write key configured and no code transferred.'
            exit 0
          fi
          umask 077
          printf '%s' "$TANGLED_BOOTSTRAP_KEY_B64" | base64 --decode > .runtime/tangled-write-key
          trap 'rm -f .runtime/tangled-write-key' EXIT
          unset TANGLED_BOOTSTRAP_KEY_B64
          test "$(ssh-keygen -lf .runtime/tangled-write-key | awk '{print $2}')" = 'SHA256:q9mRXI8is/+s2oetxesiuLySKAOChzXCY65MhzRleUA'
          export GIT_SSH_COMMAND="ssh -i $PWD/.runtime/tangled-write-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/.runtime/tangled-known-hosts"
          git remote add tangled lalalurch.tngl.sh@tangled.org:did:plc:sew3yuioawady5nrhjvqmzix
          git ls-remote tangled
          git push tangled HEAD:refs/heads/main
          git for-each-ref --format='%(refname)' refs/remotes/origin/ | while read -r ref; do
            branch=${ref#refs/remotes/origin/}
            if [[ "$branch" != 'HEAD' && "$branch" != 'main' ]]; then
              if [[ "$branch" == 'trailatlas-data' ]] && git ls-remote --exit-code --heads tangled "refs/heads/$branch" > /dev/null; then
                echo 'Preserving the public data branch already maintained by Tangled CI.'
              else
                git push tangled "$ref:refs/heads/$branch"
              fi
            fi
          done
          git push tangled --tags
          echo 'PASS: Main, data branches, tags and Git history transferred to Tangled without force pushes.'
      - name: Retain only the server public key as migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: tangled-server-key-${{ github.run_attempt }}
          path: .runtime/tangled-known-hosts
          retention-days: 7
