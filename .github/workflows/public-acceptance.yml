name: Public HTTPS acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the deployed site, every filter and all original race cards
        run: |
          mkdir -p .runtime
          python3 tests/public_checks.py --url https://trailatlas-swift.onrender.com --report public-https.json --cookie-file .runtime/acceptance-cookies.txt
      - name: Preserve the public acceptance report without personal cookies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-https-acceptance-${{ github.run_attempt }}
          path: public-https.json
          retention-days: 30
