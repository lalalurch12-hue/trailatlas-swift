name: Build the TrailAtlas Docker filesystem
# Rebuild Swift with distinct messages for a missing source and a connection failure.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unikraft-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the complete Swift server and export its runtime filesystem
        run: |
          mkdir -p dist
          docker build --platform linux/amd64 -t trailatlas-swift:unikraft .
          docker create --name trailatlas-export trailatlas-swift:unikraft
          docker export trailatlas-export | gzip -6 > dist/trailatlas-rootfs.tar.gz
          sha256sum dist/trailatlas-rootfs.tar.gz > dist/trailatlas-rootfs.tar.gz.sha256
          docker image inspect trailatlas-swift:unikraft --format '{{json .Config}}' > dist/container-config.json
          git rev-parse HEAD > dist/source-commit.txt
          python3 - <<'PYPROOF'
          import pathlib, hashlib, json
          root = pathlib.Path('.')
          expected = {'Resources/races.json': 'd80fff4ebb1f3edddcd523426c8ed9ac3046526e442590ba257e6253f920b301', 'Resources/original_unmodified.html': 'bc859a024cb3e37089a72a4910a426ef63ee40a1e7c5198f86491fd134ec975c'}
          for name, digest in expected.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
          size = (root / 'dist/trailatlas-rootfs.tar.gz').stat().st_size
          assert size < 400 * 1024 * 1024, 'Archive exceeds the conservative free artifact-storage budget'
          assert len(json.loads((root / 'Resources/races.json').read_text())) == 352
          print('PASS: complete Swift runtime built; original 352 races and design reference preserved; compressed archive bytes:', size)
          PYPROOF
      - name: Preserve the deployment filesystem without credentials
        uses: actions/upload-artifact@v4
        with:
          name: trailatlas-unikraft-rootfs-${{ github.run_attempt }}
          path: dist/
          compression-level: 0
          retention-days: 3
