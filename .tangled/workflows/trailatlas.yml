when:
  - event: push
    branch: main
    paths: ['Sources/**', 'Resources/**', 'scripts/**', 'tests/**', '.tangled/**', 'Package.*', 'Dockerfile', 'render.yaml']
  - event: manual
  - event: schedule
    schedule:
      - cron: '17 */2 * * *'
        timezone: UTC
engine: microvm
image: nixos
dependencies: [git, openssh, python3]
virtualisation:
  docker: true
cache:
  - key: swift62-tangled-release
    hash: [Package.resolved, scripts/tangled_container.sh]
    paths: [.build]
    when: always
environment:
  TANGLED_PUSH_URL: git@tangled.org:did:plc:sew3yuioawady5nrhjvqmzix
steps:
  - name: Swift build, regression tests and durable public source refresh
    command: bash scripts/tangled_ci.sh
