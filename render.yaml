services:
  - type: web
    name: trailatlas-swift
    runtime: docker
    # Render rejects Tangled Git URLs. This branch contains only the bootstrap
    # Dockerfile; application sources and public state are read from Tangled.
    repo: https://github.com/lalalurch12-hue/trailatlas-swift
    plan: free
    region: frankfurt
    branch: render-bootstrap
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /tmp/trailatlas
      - key: COOKIE_SECURE
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: SHARED_DATA_BASE_URL
        value: https://tangled.org/lalalurch.tngl.sh/trailatlas-swift/raw/trailatlas-data
